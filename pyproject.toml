# Tool configuration only. This repository ships an agent skill and HTML
# canvas, not a Python package, so there is deliberately no [project] or
# [build-system] table -- the file exists so a bare `ruff check` or `pytest`
# locally behaves the way the fork gate does.

[tool.ruff]
target-version = "py311"
src = ["tests", "tools"]

[tool.ruff.lint]
# Syntax errors and pyflakes only. Do not reformat upstream JavaScript / HTML.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
